services:
  db:
    image: postgres:17-alpine
    container_name: buddy-duckling-db
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy
      POSTGRES_DB: buddy_duckling
    ports:
      # 5432 on this machine is taken by another project, so map the host side to 5433
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy_duckling"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The API itself. Only needed to run the whole stack in containers -
  # day-to-day development still runs uvicorn on the host against `db`.
  api:
    build: .
    container_name: buddy-duckling-api
    environment:
      # Inside the compose network the database is reachable as "db:5432".
      DATABASE_URL: postgresql+asyncpg://buddy:buddy@db:5432/buddy_duckling
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-env}
      SCHEDULER_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
